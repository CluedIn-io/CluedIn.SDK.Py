trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.10'

stages:
  - stage: BuildAndTest
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Build and Test
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.x
            displayName: Use .NET SDK (for GitVersion)

          - script: dotnet tool install --global GitVersion.Tool --version 6.*
            displayName: Install GitVersion

          - script: |
              export PATH="$PATH:$HOME/.dotnet/tools"
              dotnet-gitversion /output json > gitversion.json
              cat gitversion.json
            displayName: Run GitVersion

          - script: |
              PACKAGE_VERSION=$(python3 -c "
              import json
              d = json.load(open('gitversion.json'))
              mmp = d['MajorMinorPatch']
              commits = d['CommitsSinceVersionSource']
              label = d.get('PreReleaseLabel') or ''
              print(f'{mmp}.dev{commits}' if label else mmp)
              ")
              echo "##vso[task.setvariable variable=PackageVersion;isOutput=true]$PACKAGE_VERSION"
              echo "Computed PEP440 version: $PACKAGE_VERSION"
            name: gitversion
            displayName: Extract PEP440 version

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: Use Python $(pythonVersion)

          - script: pip install poetry
            displayName: Install Poetry

          - script: poetry version $(gitversion.PackageVersion)
            displayName: Set package version

          - script: poetry install
            displayName: Install dependencies

          - script: poetry run pytest --junitxml=test-results.xml
            displayName: Run tests

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml

          - script: poetry build
            displayName: Build package

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: dist
              artifactName: dist

  - stage: Publish
    displayName: Publish to PyPI
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      packageVersion: $[ stageDependencies.BuildAndTest.BuildAndTest.outputs['gitversion.PackageVersion'] ]
    jobs:
      - job: Publish
        displayName: Publish to PyPI
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: Use Python $(pythonVersion)

          - script: pip install poetry
            displayName: Install Poetry

          - script: poetry version $(packageVersion)
            displayName: Set package version

          - script: poetry install
            displayName: Install dependencies

          - script: |
              poetry config pypi-token.pypi $(PYPI_API_TOKEN)
              poetry publish --build
            displayName: Publish package to PyPI

          - script: |
              git config user.name "Azure Pipelines"
              git config user.email "azure-pipelines@cluedin.com"
              git tag "v$(packageVersion)"
              git push origin "v$(packageVersion)"
            displayName: Tag release version
